name: Research or feature proposal
description: Propose a focused capability or experiment
title: "[Proposal]: "
labels: [proposal]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What durable coordination or runtime problem needs to be solved?
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence or experiment
      description: Describe observed behavior, a reproducible experiment, or relevant prior art.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Proposed scope
      description: Include compatibility, schema, security, and operational implications.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What smaller or simpler approaches were considered?
