name: Bug report
description: Report a reproducible defect in the research preview
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Do not include credentials, private source, databases, or unredacted logs.
  - type: input
    id: revision
    attributes:
      label: Commit
      description: The full commit SHA where the problem occurs.
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: Operating system, architecture, Go version, and relevant Python version.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction
      description: Minimal commands or code needed to reproduce the issue.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: Include sanitized output only.
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Safety check
      options:
        - label: I removed credentials and private data from this report.
          required: true
        - label: This is not a vulnerability report; security issues belong in the private channel.
          required: true
